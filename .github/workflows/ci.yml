name: AcousticSpace CI

on:
  push:
    branches:
      - backend-branch
  pull_request:
    branches:
      - backend-branch

jobs:
  test_backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository and Get the code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install the libraries required by the project
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check backend import
        run: |
          python -c "from backend.main import app; print('Backend import successful')"
      
      - name: Build Docker image
        run: |
          docker build -t acousticspace .